name: Downstream via workflow_dispatch

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Name of the secret to encode (e.g., GARALT)'
        required: true
        default: 'GARALT'
        type: string
      extra_data:
        description: 'Optional extra data to include'
        required: false
        type: string

jobs:
  manual-encode:
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        run: |
          echo "Encoding secret: ${{ inputs.secret_name }}"
          echo "Extra data: ${{ inputs.extra_data }}"

      - name: Trigger workflow_dispatch via API (Corrected)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 创建一个 JSON 对象作为请求体，并通过标准输入传递给 gh api
          echo '{"ref":"main","inputs":{"triggered_by":"pull_request_target"}}' | \
            gh api repos/$REPO/actions/workflows/downstream-dispatch.yml/dispatches --input -
