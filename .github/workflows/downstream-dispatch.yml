name: Downstream via workflow_dispatch

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Who triggered this workflow'
        required: false
        type: string

jobs:
  encode_secret:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger source
        run: echo "1"

      - name: Double base64 encode GARALT
        env:
          GARALT: ${{ secrets.GARALT }}
        run: |
          if [ -n "$GARALT" ]; then
            echo "Double base64 encoded GARALT:"
            printf '%s' "$GARALT" | base64 -w0 | base64 -w0
          else
            echo "Secret GARALT is not set in this repository."
          fi
